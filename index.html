<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joey Interrante | Drummer</title>
    <meta name="description" content="Joey Interrante - Professional drummer. Five decades behind the kit. Bookings, gigs, and session work.">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Oswald', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 0%, rgba(230, 57, 70, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(180, 40, 50, 0.08) 0%, transparent 50%);
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            max-width: 480px;
            width: 100%;
        }

        .name {
            font-size: clamp(3rem, 8vw, 4.5rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 0.95;
            margin-bottom: 0.3rem;
        }

        .name span {
            display: block;
            background: linear-gradient(135deg, #e63946, #c62828);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .role {
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 3rem;
        }

        .section-label {
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #444;
            margin-bottom: 1rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 2.5rem;
        }

        .links a {
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 1rem 1.5rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .links a:hover {
            background: rgba(230, 57, 70, 0.15);
            border-color: rgba(230, 57, 70, 0.4);
            transform: translateX(4px);
        }

        .links a .arrow {
            color: #666;
            transition: color 0.3s;
            font-weight: 300;
        }

        .links a:hover .arrow {
            color: #e63946;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 0.5rem 0 2.5rem;
        }

        .studio-cta {
            display: block;
            text-align: center;
            padding: 1.2rem;
            background: linear-gradient(135deg, rgba(230, 57, 70, 0.1), rgba(230, 57, 70, 0.05));
            border: 1px solid rgba(230, 57, 70, 0.2);
            text-decoration: none;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;
            margin-bottom: 3rem;
        }

        .studio-cta:hover {
            background: rgba(230, 57, 70, 0.2);
            border-color: rgba(230, 57, 70, 0.5);
        }

        .studio-cta .sub {
            display: block;
            font-size: 0.7rem;
            color: #666;
            letter-spacing: 3px;
            margin-top: 0.3rem;
        }

        .coming {
            text-align: center;
            font-size: 0.65rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1 class="name">Joey <span>Interrante</span></h1>
        <p class="role">Drummer</p>

        <p class="section-label">Book &amp; Connect</p>
        <div class="links">
            <a href="sms:+18133268800&body=Hi Joey, I'd like to book you for a gig.%0AMy name:%0ADate:%0AVenue:">
                Book a gig <span class="arrow">&rarr;</span>
            </a>
            <a href="https://www.instagram.com/interrantejoseph_banjoey" target="_blank">
                Instagram <span class="arrow">&rarr;</span>
            </a>
            <a href="https://www.facebook.com/joey.gmsdrums" target="_blank">
                Facebook <span class="arrow">&rarr;</span>
            </a>
            <a href="https://www.youtube.com/@banjoeydrummer" target="_blank">
                YouTube <span class="arrow">&rarr;</span>
            </a>
        </div>

        <div class="divider"></div>

        <a href="https://hippocketstudios.com" class="studio-cta">
            Hip Pocket Studios
            <span class="sub">Remote drum tracks &rarr;</span>
        </a>

        <p class="coming">Full site coming soon</p>
    </div>

    <script>
        if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            document.querySelectorAll('a[href*="sms:"]').forEach(function(btn) {
                btn.href = "mailto:interrantej@gmail.com?subject=Gig Booking Inquiry&body=Hi Joey, I'd like to book you for a gig.%0AMy name:%0ADate:%0AVenue:";
            });
        }
    </script>
</body>
</html>
