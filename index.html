<html lang="en">
<head>

    <meta name="robots" content="index, follow">

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;600;700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #e63946;
            --red-dim: rgba(230,57,70,0.15);
            --red-border: rgba(230,57,70,0.3);
            --bg: #080808;
            --bg-card: #0f0f0f;
            --bg-card-hover: #141414;
            --text: #f0f0f0;
            --text-mid: #888;
            --text-dim: #444;
            --border: rgba(255,255,255,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Oswald', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 15% 0%, rgba(230,57,70,0.07) 0%, transparent 70%),
                radial-gradient(ellipse 40% 30% at 85% 100%, rgba(180,30,40,0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .page {
            position: relative;
            z-index: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 4rem 2.5rem 6rem;
        }

        /* HEADER */
        header {
            margin-bottom: 4rem;
            animation: fadeUp 0.8s ease both;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 2rem;
        }
        .name-first {
            display: block;
            font-size: clamp(3.5rem, 8vw, 6.5rem);
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1;
            color: var(--text);
            text-transform: uppercase;
        }
        .name-last {
            display: block;
            font-size: clamp(3.5rem, 8vw, 6.5rem);
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1;
            color: var(--red);
            text-transform: uppercase;
        }
        .title-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.8rem;
        }
        .title-bar::before {
            content: '';
            display: block;
            width: 2rem;
            height: 2px;
            background: var(--red);
            flex-shrink: 0;
        }
        .role-text {
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--text-mid);
        }
        .header-links {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: flex-end;
        }
        .header-link {
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-dim);
            text-decoration: none;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .header-link:hover { color: var(--red); }

        /* SECTION LABEL */
        .section-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* WEEK NAV */
        .week-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            animation: fadeUp 0.8s 0.1s ease both;
        }
        .week-range {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--text-mid);
        }
        .week-count {
            font-family: 'Space Mono', monospace;
            font-size: 0.55rem;
            letter-spacing: 2px;
            color: rgba(230,57,70,0.6);
            margin-top: 0.2rem;
        }
        .week-arrows { display: flex; gap: 0.4rem; }
        .week-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-family: 'Oswald', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 0.4rem 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .week-btn:hover { border-color: var(--red-border); color: var(--red); }
        .week-btn:disabled { opacity: 0.2; cursor: default; pointer-events: none; }

        /* SHOWS */
        .shows-section {
            margin-bottom: 4rem;
            animation: fadeUp 0.8s 0.15s ease both;
        }
        .gig-list { display: flex; flex-direction: column; }
        .gig {
            display: grid;
            grid-template-columns: 64px 1fr 120px;
            gap: 0 1.5rem;
            padding: 1.1rem 0;
            border-bottom: 1px solid var(--border);
            align-items: center;
            position: relative;
        }
        .gig:first-child { border-top: 1px solid var(--border); }
        .gig::before {
            content: '';
            position: absolute;
            left: -2.5rem;
            top: 0; bottom: 0;
            width: 2px;
            background: var(--red);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.25s ease;
        }
        .gig:hover::before { transform: scaleY(1); }
        .gig-date { text-align: center; }
        .gig-month {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 0.55rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--red);
            line-height: 1;
            margin-bottom: 0.2rem;
        }
        .gig-day {
            display: block;
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1;
            color: var(--text);
        }
        .gig-info { display: flex; flex-direction: column; gap: 0.2rem; }
        .gig-act {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text);
            line-height: 1.2;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .gig-feat { font-weight: 300; color: var(--text-mid); font-size: 0.9rem; }
        .gig-sublabel {
            font-family: 'Space Mono', monospace;
            font-size: 0.52rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        .gig-venue-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .gig-venue {
            font-size: 0.72rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-mid);
            text-decoration: none;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .gig-venue:hover { color: var(--red); }
        .gig-venue svg { width: 11px; height: 11px; opacity: 0.5; flex-shrink: 0; transition: opacity 0.2s; }
        .gig-venue:hover svg { opacity: 1; }
        .gig-time {
            font-family: 'Space Mono', monospace;
            font-size: 0.58rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        /* PHOTO */
        .gig-photo {
            width: 120px;
            height: 72px;
            overflow: hidden;
            background: var(--bg-card);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        .gig-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .gig:hover .gig-photo img { transform: scale(1.05); }
        .gig-photo-ph {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .gig-photo-ph svg { opacity: 0.15; }
        .gig-photo-ph span {
            font-family: 'Space Mono', monospace;
            font-size: 0.42rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        /* TODAY BADGE */
        .today-badge {
            display: inline-block;
            font-family: 'Space Mono', monospace;
            font-size: 0.48rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: var(--red);
            color: #fff;
            padding: 2px 6px;
            line-height: 1.6;
        }

        .no-shows {
            padding: 3rem 0;
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
        }

        /* LINKS */
        .links-section { animation: fadeUp 0.8s 0.25s ease both; }
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.4rem;
            margin-bottom: 0.4rem;
        }
        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            text-decoration: none;
            color: var(--text);
            transition: all 0.25s;
        }
        .link-item:hover {
            background: var(--bg-card-hover);
            border-color: var(--red-border);
            transform: translateX(3px);
        }
        .link-item-left { display: flex; align-items: center; gap: 0.8rem; }
        .link-icon { width: 16px; height: 16px; color: var(--text-dim); flex-shrink: 0; transition: color 0.25s; }
        .link-item:hover .link-icon { color: var(--red); }
        .link-name { font-size: 0.8rem; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; }
        .link-arrow { font-size: 0.85rem; color: var(--text-dim); transition: color 0.25s; }
        .link-item:hover .link-arrow { color: var(--red); }
        .studio-cta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 1.5rem;
            background: linear-gradient(135deg, rgba(230,57,70,0.08), rgba(230,57,70,0.04));
            border: 1px solid var(--red-border);
            text-decoration: none;
            color: var(--text);
            transition: all 0.25s;
        }
        .studio-cta:hover { background: rgba(230,57,70,0.14); border-color: rgba(230,57,70,0.5); transform: translateX(3px); }
        .studio-left { display: flex; flex-direction: column; gap: 0.2rem; }
        .studio-name { font-size: 0.85rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }
        .studio-sub { font-size: 0.65rem; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; color: var(--text-mid); }
        .studio-arrow { color: var(--red); font-size: 1.1rem; }

        /* FOOTER */
        footer {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeUp 0.8s 0.3s ease both;
        }
        .footer-phone {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer-phone:hover { color: var(--text-mid); }
        .footer-note { font-size: 0.6rem; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; color: var(--text-dim); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* RESPONSIVE */
        @media (max-width: 680px) {
            .page { padding: 3rem 1.5rem 5rem; }
            .gig { grid-template-columns: 52px 1fr; }
            .gig-photo { display: none; }
            .gig-day { font-size: 1.5rem; }
            header { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .header-links { align-items: flex-start; }
            .link-grid { grid-template-columns: 1fr; }
            footer { flex-direction: column; gap: 0.8rem; align-items: flex-start; }
        }
    </style>
</head>

var weekOffset = 0;

function midnight(d) { var m = new Date(d); m.setHours(0,0,0,0); return m; }

function fmtRange(s, e) {
    var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return mo[s.getMonth()] + ' ' + s.getDate() + ' \u2013 ' + mo[e.getMonth()] + ' ' + e.getDate();
}

function venueIcon(url) {
    if (url.indexOf('instagram') > -1) {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';
}

function phIcon() {
    return '<div class="gig-photo-ph"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.5"><rect x="2" y="6" width="20" height="15" rx="2"/><circle cx="12" cy="13" r="4"/><path d="M8 6l2-3h4l2 3"/></svg><span>Photo soon</span></div>';
}

function renderShows() {
    var now = new Date();
    var todayMid = midnight(now);
    var winStart = new Date(todayMid);
    winStart.setDate(winStart.getDate() + weekOffset * 7);
    var winEnd = new Date(winStart);
    winEnd.setDate(winEnd.getDate() + 7);

    var winEndLabel = new Date(winEnd.getTime() - 86400000);
    document.getElementById('weekRange').textContent = fmtRange(winStart, winEndLabel);
    document.getElementById('prevWeek').disabled = (weekOffset <= 0);

    var list = document.getElementById('gigList');
    list.innerHTML = '';
    var visible = 0;

    SHOWS.forEach(function(s) {
        var showDate = midnight(new Date(s.date + 'T00:00:00'));
        var showEnd  = new Date(s.date + 'T' + s.endTime + ':00');
        if (now > showEnd) return;
        if (showDate < winStart || showDate >= winEnd) return;
        visible++;
        var isToday = showDate.toDateString() === now.toDateString();

        var actHtml = s.act;
        if (s.feat) actHtml += ' <span class="gig-feat">' + s.feat + '</span>';
        if (isToday) actHtml += ' <span class="today-badge">Tonight</span>';

        var html = '<article class="gig">'
            + '<div class="gig-date"><span class="gig-month">' + s.month + '</span><span class="gig-day">' + s.day + '</span></div>'
            + '<div class="gig-info">'
            +   '<div class="gig-act">' + actHtml + '</div>'
            +   (s.sublabel ? '<div class="gig-sublabel">' + s.sublabel + '</div>' : '')
            +   '<div class="gig-venue-row"><a class="gig-venue" href="' + s.venueUrl + '" target="_blank" rel="noopener">' + venueIcon(s.venueUrl) + s.venue + '</a></div>'
            +   '<span class="gig-time">' + s.time + '</span>'
            + '</div>'
            + '<div class="gig-photo"><img src="' + s.photo + '" alt="' + s.photoAlt + '" onerror="this.outerHTML=\'' + phIcon().replace(/'/g, "\\'") + '\'"></div>'
            + '</article>';

        list.insertAdjacentHTML('beforeend', html);
    });

    var noEl = document.getElementById('noShows');
    var countEl = document.getElementById('weekCount');
    if (visible === 0) {
        noEl.style.display = 'block';
        countEl.textContent = '';
    } else {
        noEl.style.display = 'none';
        countEl.textContent = visible + (visible === 1 ? ' show' : ' shows');
    }
}

function shiftWeek(dir) {
    weekOffset += dir;
    if (weekOffset < 0) weekOffset = 0;
    renderShows();
}

    if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {

        var b2 = document.getElementById('bookBtnHeader');

        if (b2) b2.href = e;
    }
})();

renderShows();
