<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanks! | Joey Interrante</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080808'/%3E%3Ctext x='3' y='26' font-family='Arial Black,Arial' font-weight='900' font-size='26' fill='%23e63946'%3EJ%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;600;700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #e63946;
            --red-border: rgba(230,57,70,0.3);
            --bg: #080808;
            --bg-card: #0f0f0f;
            --text: #f0f0f0;
            --text-mid: #888;
            --text-dim: #444;
            --border: rgba(255,255,255,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Oswald', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 15% 0%, rgba(230,57,70,0.07) 0%, transparent 70%),
                radial-gradient(ellipse 40% 30% at 85% 100%, rgba(180,30,40,0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .wrap {
            position: relative;
            z-index: 1;
            max-width: 560px;
            padding: 4rem 2.5rem;
            text-align: left;
            animation: fadeUp 0.8s ease both;
        }
        .check {
            width: 48px;
            height: 48px;
            background: rgba(230,57,70,0.1);
            border: 1px solid var(--red-border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .heading-top {
            display: block;
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1;
            text-transform: uppercase;
            color: var(--text);
        }
        .heading-bot {
            display: block;
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1;
            text-transform: uppercase;
            color: var(--red);
            margin-bottom: 1.5rem;
        }
        .sub {
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--text-mid);
            line-height: 1.7;
            margin-bottom: 3rem;
            max-width: 400px;
        }
        .divider {
            width: 2rem;
            height: 2px;
            background: var(--red);
            margin-bottom: 3rem;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 0.9rem 1.8rem;
            transition: all 0.2s;
        }
        .back-btn:hover {
            border-color: var(--red-border);
            color: var(--red);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 480px) {
            .wrap { padding: 3rem 1.5rem; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="check">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e63946" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <span class="heading-top">Message</span>
    <span class="heading-bot">Received.</span>
    <div class="divider"></div>
    <p class="sub">Joey will get back to you within 24 hours. Check your inbox for a confirmation.</p>
    <a class="back-btn" href="index.html">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Joey's page
    </a>
</div>
</body>
</html>
